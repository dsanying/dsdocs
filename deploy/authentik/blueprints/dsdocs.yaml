# Native authentik blueprint; no user credentials or custom policy code.
version: 1
metadata:
  name: DSdocs - editor access
entries:
  - model: authentik_brands.brand
    identifiers:
      default: true
    attrs:
      branding_title: DSdocs
      attributes:
        settings:
          locale: zh-Hans
  - model: authentik_core.group
    id: editors
    identifiers:
      name: editors
  - model: authentik_providers_proxy.proxyprovider
    id: editor-provider
    identifiers:
      name: dsdocs-editor
    attrs:
      mode: forward_single
      external_host: !Env [DSDOCS_EDITOR_URL, 'http://editor.localhost:5181']
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: seconds=30
      refresh_token_validity: hours=8
  - model: authentik_core.application
    id: editor-application
    identifiers:
      slug: dsdocs-editor
    attrs:
      name: DSdocs
      provider: !KeyOf editor-provider
      meta_launch_url: !Env [DSDOCS_EDITOR_URL, 'http://editor.localhost:5181']
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf editor-application
      group: !KeyOf editors
      order: 0
    attrs:
      enabled: true
  - model: authentik_outposts.outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      providers:
        - !KeyOf editor-provider
      config:
        authentik_host: !Env [DSDOCS_IDENTITY_URL, 'http://auth.localhost:9000']
  - model: authentik_rbac.role
    id: management-role
    identifiers:
      name: dsdocs-management
    attrs:
      permissions:
        - authentik_core.view_user
        - authentik_core.add_user
        - authentik_core.change_user
        - authentik_core.reset_user_password
        - authentik_core.view_group
        - authentik_core.add_user_to_group
  - model: authentik_core.user
    id: management-user
    identifiers:
      username: dsdocs-management
    attrs:
      name: DSdocs management service
      type: service_account
      path: services
      roles:
        - !KeyOf management-role
  - model: authentik_core.token
    identifiers:
      identifier: dsdocs-management
    attrs:
      user: !KeyOf management-user
      intent: api
      expiring: false
      key: !Env DSDOCS_IDENTITY_API_TOKEN
