name: prepare-release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: pnpm install:all
      - run: pnpm check
      - name: Build images without publishing
        run: |
          docker build --target reader --tag dsdocs-reader:preflight .
          docker build --target studio --tag dsdocs-studio:preflight .
      - uses: actions/upload-artifact@v4
        with:
          name: dsdocs-example-static-reader
          path: apps/reader/out
          if-no-files-found: error
          include-hidden-files: true
