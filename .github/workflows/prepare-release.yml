name: prepare-release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: pnpm install:all
      - run: pnpm check
      - name: Pack public React package
        run: |
          mkdir -p release-artifacts
          pnpm -C packages/react pack --out "$GITHUB_WORKSPACE/release-artifacts/dsdocs.tgz"
          cd release-artifacts
          sha256sum dsdocs.tgz > SHA256SUMS
      - name: Build images without publishing
        run: |
          docker build --target reader --tag dsdocs-reader:preflight .
          docker build --target management --tag dsdocs-management:preflight .
      - uses: actions/upload-artifact@v4
        with:
          name: dsdocs-build-evidence
          path: |
            release-artifacts/dsdocs.tgz
            release-artifacts/SHA256SUMS
            apps/manage/dist
            apps/reader/public/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
          include-hidden-files: true
