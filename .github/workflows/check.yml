name: dsdocs-check
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: dsdocs-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: |
            apps/manage/pnpm-lock.yaml
            apps/reader/pnpm-lock.yaml
      - run: pnpm install:all
      - run: pnpm check
      - run: pnpm -C apps/manage exec playwright install --with-deps chromium firefox
      - run: DSDOCS_CHROME_CHANNEL=chromium pnpm test:browser

      - run: DSDOCS_CHROME_CHANNEL=chromium pnpm test:starter:browser

      - run: DSDOCS_CHROME_CHANNEL=chromium pnpm test:settings:browser

      - run: DSDOCS_CHROME_CHANNEL=chromium pnpm test:layout:browser
