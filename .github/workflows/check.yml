name: dsdocs-check
on:
  push:
    paths:
      - "*"
      - apps/manage/**
      - apps/reader/**
      - docs/**
      - scripts/**
      - packages/**
      - quality/**
      - AGENTS.md
      - package.json
      - .github/workflows/check.yml
  pull_request:
    paths:
      - "*"
      - apps/manage/**
      - apps/reader/**
      - docs/**
      - scripts/**
      - packages/**
      - quality/**
      - AGENTS.md
      - package.json
      - .github/workflows/check.yml
permissions:
  contents: read
concurrency:
  group: dsdocs-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: |
            apps/manage/pnpm-lock.yaml
            apps/reader/pnpm-lock.yaml
      - run: pnpm install:all
      - run: pnpm run check
